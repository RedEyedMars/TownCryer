[package]
name = "town_cryer"
version = "0.1.0"
edition = "2024"

[dependencies]
#bevy = "0.19.1"
bevy = { version = "0.19.1", features = ["default", "debug", "serialize"] }
bevy_ecs_tiled = "0.13.4"
bevy_ecs_tilemap = "0.19.0"
bevy_northstar = "0.7"
bevy_lunex = "0.7.0"
itertools = "0.15.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
thiserror = "2.0.21"
tiled = "0.16.0"

wayland-sys = {version = "0.31", features = ["dlopen"]}
bevy_dylib = "0.19.1"
strum = { version="0.28.0", features = ["derive"] }
rmp-serde = "1.3.1"
serde = "1.0.229"

saveable = { path = "./lib" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
