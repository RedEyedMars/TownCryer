[package]
name = "town_cryer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.16.1"
bevy_ecs_tiled = "0.7.4"
bevy_ecs_tilemap = "0.16.0"
bevy_lunex = "0.4.2"
itertools = "0.14.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
thiserror = "2.0.12"
tiled = "0.14.0"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
